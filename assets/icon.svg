<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2135"/>
      <stop offset="1" stop-color="#12141f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#e56ed8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#e56ed8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded-square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <!-- symmetric waveform, peaks shaping an abstract "A" -->
    <g fill="url(#wave)">
      <rect x="82"  y="246" width="32" height="106" rx="16"/>
      <rect x="137" y="196" width="32" height="156" rx="16"/>
      <rect x="192" y="142" width="32" height="210" rx="16"/>
      <rect x="247" y="128" width="32" height="224" rx="16"/>
      <rect x="302" y="180" width="32" height="172" rx="16"/>
      <rect x="357" y="222" width="32" height="130" rx="16"/>
      <rect x="412" y="252" width="32" height="100" rx="16"/>
    </g>
    <!-- pulse dot: the "beat" hovering above the crest -->
    <circle cx="263" cy="82" r="15" fill="url(#pulse)"/>
  </g>
</svg>
